<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · David Paredes</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0E1621; --ink:#F4F1EA; --mut:#9AA6B6; --amb:#F2B33D; --line:#26364A; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; background: var(--bg); color: var(--ink);
    font-family: Inter, system-ui, sans-serif;
    background-image: radial-gradient(600px 400px at 50% 40%, rgba(242,179,61,.12), transparent 70%); }
  .code { font-size: clamp(96px, 22vw, 180px); font-weight: 800; letter-spacing: -.05em; line-height: 1; color: transparent; -webkit-text-stroke: 2px var(--amb); }
  h1 { font-size: 28px; margin-top: 16px; letter-spacing: -.02em; }
  p { color: var(--mut); margin-top: 10px; }
  a { display: inline-block; margin-top: 28px; background: var(--amb); color: #16120A; font-weight: 700; text-decoration: none; padding: 13px 22px; border-radius: 12px; }
</style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Esta página no existe <span style="color:var(--mut);font-weight:500">· Page not found</span></h1>
    <p>Puede que el enlace esté mal o que la página se haya movido.</p>
    <a href="/">Volver al inicio · Back home</a>
  </main>
</body>
</html>
